name: Sync docs to the wiki
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/wiki.py', '.github/workflows/wiki.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the docs into the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          find wiki -maxdepth 1 -name '*.md' -delete
          python3 .github/wiki.py docs wiki
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Wiki already up to date" || { git commit -m "Sync docs from ${GITHUB_SHA::7}" && git push; }
